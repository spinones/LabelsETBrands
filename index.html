<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ET Brands · Etiquetas por SKU</title>
<style id="pagesize">@page { size: 50mm 25mm; margin: 0 }</style>
<style>
:root { --bg:#f4f4f3; --card:#fff; --fg:#111; --muted:#6b6b69; --line:#dcdcda; --accent:#E94F1D; --gray:#898987; --ok:#1a7f45; --err:#b42318; }
* { box-sizing:border-box }
[hidden] { display:none !important }
body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif }
.top { background:#fff; border-bottom:4px solid var(--accent) }
.top .in { max-width:760px; margin:0 auto; padding:12px 16px; display:flex; align-items:center; gap:16px }
.top img { height:52px; width:auto }
.top .t { border-left:2px solid var(--line); padding-left:16px }
.top .t h1 { font-size:20px; font-weight:800; letter-spacing:-.01em }
.wrap { max-width:760px; margin:0 auto; padding:24px 16px; display:grid; gap:16px }
h1 { font-size:20px; margin:0 }
.sub { color:var(--muted); font-size:13px }
#print:hover { filter:brightness(.92) }
.card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; display:grid; gap:12px }
.card { border-top:3px solid var(--fg) }
label { font-size:12px; color:var(--gray); text-transform:uppercase; letter-spacing:.05em; color:var(--muted); font-weight:600 }
#sku { width:100%; font-size:26px; padding:12px 14px; border:2px solid var(--line); border-radius:8px; font-family:ui-monospace,Consolas,monospace; text-transform:uppercase }
#sku:focus { outline:none; border-color:var(--accent) }
.sugg { display:flex; flex-wrap:wrap; gap:6px }
.sugg button { border:1px solid var(--line); background:var(--bg); border-radius:6px; padding:4px 8px; cursor:pointer; font:13px ui-monospace,Consolas,monospace }
.sugg button:hover { border-color:var(--accent) }
.msg { font-weight:600 } .msg.err { color:var(--err) } .msg.ok { color:var(--ok) }
.info { display:grid; grid-template-columns:auto 1fr; gap:4px 12px; font-size:14px }
.info b { color:var(--muted); font-weight:600 }
.row { display:flex; flex-wrap:wrap; gap:12px; align-items:end }
.row > div { display:grid; gap:4px }
select, input[type=number] { font-size:15px; padding:8px; border:1px solid var(--line); border-radius:6px; background:var(--card); color:var(--fg) }
input[type=number] { width:90px }
#print { font-size:18px; font-weight:700; padding:12px 28px; border:0; border-radius:8px; background:var(--accent); color:#fff; cursor:pointer }
#print:disabled { opacity:.4; cursor:default }
.preview { display:flex; justify-content:center; padding:16px; background:repeating-linear-gradient(45deg,#ececea 0 8px,#f4f4f3 8px 16px); border-radius:8px }
.preview .label { box-shadow:0 1px 4px rgba(0,0,0,.25) }
.statusbar { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-top:6px }
.status { font-size:13px; font-weight:600; padding:3px 10px; border-radius:999px }
.status.on { background:#e5f4e4; color:var(--ok) } .status.off { background:#f9eeda; color:#8a5a00 } .status.wait { background:#ececea; color:var(--muted) }
#refresh { font-size:13px; padding:4px 12px; border:1px solid var(--line); border-radius:6px; background:var(--card); cursor:pointer }
.warn { display:block; color:#8a5a00; font-weight:600; font-size:13px; margin-top:4px }
#eanSel { font:14px ui-monospace,Consolas,monospace; padding:4px 6px }
.foot { font-size:12px; color:var(--muted) }
.foot button { font-size:12px }

/* Etiqueta */
.label { background:#fff; color:#000; overflow:hidden; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:1.5mm 2mm; page-break-after:always; break-after:page }
.label svg { width:100%; display:block }
.label .num { font:600 9pt/1 ui-monospace,Consolas,monospace; letter-spacing:.08em; margin-top:.6mm }
.label .sk { font:700 7pt/1.1 system-ui,sans-serif; margin-top:.6mm; text-align:center; max-width:100% ; white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
.label .nm { font:6pt/1.1 system-ui,sans-serif; text-align:center; max-height:2.3em; overflow:hidden }

#printarea { display:none }
@media print {
  body { background:#fff }
  .wrap, .top { display:none }
  #printarea { display:block }
  #printarea .label:last-child { page-break-after:auto; break-after:auto }
}
</style>
</head>

const SHEET_ID = '1rIVIU6s3TdmVujLnAu2j9XDR4i-utkn1uzRux-8ryrg';
const SNAP_DATE = '17-11-2026';

const $ = id => document.getElementById(id);
const SIZES = { '50x25':[50,25], '60x40':[60,40], '100x50':[100,50], '100x150':[100,150] };
let IDX = new Map(), EANIDX = new Map(), cur = null;

function cleanEan(v){ if(typeof v==='number') v=Math.round(v).toFixed(0); let e=String(v||'').replace(/\D/g,''); if(e.length===12) e='0'+e; return e.length>=8 ? e : ''; }
function ean13ok(e){ if(!/^\d{13}$/.test(e)) return false; let s=0; for(let i=0;i<12;i++) s+= +e[i]*(i%2?3:1); return (10-s%10)%10 === +e[12]; }

// Une planilla (manda en EAN) + Check (respaldo y SKUs que no están en la planilla)
function build(){
  IDX = new Map(); EANIDX = new Map();
  const get = s => { const k=s.toUpperCase(); if(!IDX.has(k)) IDX.set(k,{sku:s, name:'', eans:[], checkEan:''}); return IDX.get(k); };
  CHECK.forEach(([s,n,e]) => { const r=get(s); r.name=n||r.name; r.checkEan=cleanEan(e); });
  SHEET.forEach(([s,e,n]) => { const r=get(s); const c=cleanEan(e); if(c && !r.eans.includes(c)) r.eans.push(c); if(!r.name && n) r.name=n; });
  IDX.forEach(r => {
    if(!r.eans.length && r.checkEan) r.eans=[r.checkEan];
    r.eans.forEach(e => EANIDX.set(e, r));
  });
  $('nprod').textContent = IDX.size;
}

function setStatus(kind, text){ const s=$('status'); s.className='status '+kind; s.textContent=text; }

// Lee la planilla en línea (JSONP de Google Sheets: funciona abriendo el archivo directo en Chrome)
function loadSheet(){
  setStatus('wait','Conectando con la planilla…');
  const cb = 'sheetCb' + Date.now();
  const sc = document.createElement('script');
  const timer = setTimeout(() => fail('sin respuesta'), 12000);
  function fail(why){
    clearTimeout(timer); delete window[cb]; sc.remove();
    setStatus('off', `Sin conexión con la planilla (${why}). Usando copia del ${SNAP_DATE}.`);
  }
  window[cb] = resp => {
    clearTimeout(timer); delete window[cb]; sc.remove();
    try{
      if(resp.status==='error') throw new Error('planilla sin acceso');
      const val = c => c==null ? '' : String(c.f!=null ? c.f : (c.v!=null ? c.v : '')).trim();
      const out=[];
      resp.table.rows.forEach(row => {
        const c = row.c || [];
        const A=val(c[0]),B=val(c[1]),C=val(c[2]),F=val(c[5]),G=val(c[6]),H=val(c[7]);
        if(C && A && C.toUpperCase()!=='SKU') out.push([C,A,B]);
        if(F && G) out.push([F,G,H]);
      });
      if(out.length < 50) throw new Error('planilla vacía o con otro formato');
      // si la planilla en línea viene sin EAN para algún SKU (celdas con otro formato), se completa con la copia
      const live = new Set(out.map(r=>r[0].toUpperCase()));
      SHEET = out.concat(SNAP.filter(r=>!live.has(r[0].toUpperCase()))); build();
      const t = new Date().toLocaleTimeString('es-CL',{hour:'2-digit',minute:'2-digit'});
      setStatus('on', `En línea con la planilla · ${out.length} EAN · actualizado ${t}`);
      if(cur) select(IDX.get(cur.sku.toUpperCase()));
    }catch(err){ fail(err.message); }
  };
  sc.onerror = () => fail('sin internet');
  sc.src = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?gid=0&headers=1&tqx=out:json;responseHandler:${cb}&_=${Date.now()}`;
  document.head.appendChild(sc);
}

try { const s = localStorage.getItem('etq_size'); if (s && SIZES[s]) $('size').value = s;
      const t = localStorage.getItem('etq_txt'); if (t) $('showName').value = t; } catch(e){}

function curEan(){ return cur && cur.eans.length ? $('eanSel').value : ''; }
function codeFor(r){
  const e = curEan();
  if ($('tipo').value==='ean' && e) return { value:e, format: ean13ok(e) ? 'EAN13' : 'CODE128' };
  return { value:r.sku, format:'CODE128' };
}

function labelEl(r){
  const [w,h] = SIZES[$('size').value];
  const c = codeFor(r), txt = $('showName').value;
  const d = document.createElement('div'); d.className='label';
  d.style.width = w+'mm'; d.style.height = h+'mm';
  const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
  d.appendChild(svg);
  JsBarcode(svg, c.value, { format:c.format, displayValue:false, margin:0, marginLeft:22, marginRight:22, height:100, width:2, flat:true });
  svg.setAttribute('preserveAspectRatio','none');
  const textLines = txt==='none'?0 : txt==='sku'?1 : 2;
  svg.style.height = Math.max(h - 3 - 3.5 - textLines*3.2, 6)+'mm';
  const n = document.createElement('div'); n.className='num'; n.textContent=c.value; d.appendChild(n);
  if (txt!=='none' && c.value!==r.sku) { const s=document.createElement('div'); s.className='sk'; s.textContent=r.sku; d.appendChild(s); }
  if (txt==='skuname' && r.name) { const s=document.createElement('div'); s.className='nm'; s.textContent=r.name; d.appendChild(s); }
  return d;
}

function render(){
  if(!cur) return;
  $('preview').innerHTML=''; $('preview').appendChild(labelEl(cur));
  const [w,h]=SIZES[$('size').value];
  $('pagesize').textContent = `@page { size: ${w}mm ${h}mm; margin: 0 }`;
}

function select(r){
  cur = r;
  $('rSku').textContent=r.sku; $('rName').textContent=r.name||'—';
  const sel=$('eanSel'); sel.innerHTML='';
  r.eans.forEach(e => { const o=document.createElement('option'); o.value=e; o.textContent=e; sel.appendChild(o); });
  if(r.eans.length>1){ sel.value = r.eans.includes(r.checkEan) ? r.checkEan : r.eans[r.eans.length-1]; }
  sel.hidden = !r.eans.length;
  $('eanNone').hidden = !!r.eans.length;
  $('eanWarn').hidden = r.eans.length < 2;
  $('tipo').value = r.eans.length ? 'ean' : 'sku';
  $('tipo').querySelector('[value=ean]').disabled = !r.eans.length;
  $('result').hidden=false; $('sugg').innerHTML='';
  $('msg').className='msg ok'; $('msg').textContent='Encontrado';
  $('copies').value=1;
  render();
  $('print').focus();
}

function search(){
  const q = $('sku').value.trim().toUpperCase();
  $('sugg').innerHTML='';
  if(!q){ $('msg').textContent=''; return; }
  const exact = IDX.get(q) || EANIDX.get(cleanEan(q));
  if (exact) return select(exact);
  cur=null; $('result').hidden=true;
  const parts = [...IDX.values()].filter(r=>r.sku.toUpperCase().includes(q) || (r.name||'').toUpperCase().includes(q)).slice(0,20);
  $('msg').className='msg err';
  $('msg').textContent = parts.length ? 'No hay coincidencia exacta. ¿Es alguno de estos?' : 'SKU no encontrado en la base maestra';
  parts.forEach(r=>{ const b=document.createElement('button'); b.textContent=r.sku; b.title=r.name||''; b.onclick=()=>{ $('sku').value=r.sku; select(r); }; $('sugg').appendChild(b); });
}

$('sku').addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); search(); } });
['tipo','size','showName','eanSel'].forEach(id=>$(id).addEventListener('change',()=>{ try{localStorage.setItem('etq_size',$('size').value);localStorage.setItem('etq_txt',$('showName').value);}catch(e){} render(); }));
$('refresh').addEventListener('click', loadSheet);

$('print').addEventListener('click', ()=>{
  if(!cur) return;
  const n = Math.min(Math.max(parseInt($('copies').value)||1,1),500);
  const pa = $('printarea'); pa.innerHTML='';
  for(let i=0;i<n;i++) pa.appendChild(labelEl(cur));
  render();
  window.print();
});
window.addEventListener('afterprint', ()=>{ $('printarea').innerHTML=''; $('sku').value=''; $('sku').focus(); });

SHEET = SNAP; build();
setStatus('off', `Copia del ${SNAP_DATE}`);
loadSheet();
</script>
