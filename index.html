<meta charset="utf-8">

<title>ET Brands · Etiquetas por SKU</title>
<style id="pagesize">@page { size: 50mm 25mm; margin: 0 }</style>
<style>
:root { --bg:#f4f4f3; --card:#fff; --fg:#111; --muted:#6b6b69; --line:#dcdcda; --accent:#E94F1D; --gray:#898987; --ok:#1a7f45; --err:#b42318; }
* { box-sizing:border-box }
body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif }
.top { background:#fff; border-bottom:4px solid var(--accent) }
.top .in { max-width:760px; margin:0 auto; padding:12px 16px; display:flex; align-items:center; gap:16px }
.top img { height:52px; width:auto }
.top .t { border-left:2px solid var(--line); padding-left:16px }
.top .t h1 { font-size:20px; font-weight:800; letter-spacing:-.01em }
.wrap { max-width:760px; margin:0 auto; padding:24px 16px; display:grid; gap:16px }
h1 { font-size:20px; margin:0 }
.sub { color:var(--muted); font-size:13px }
#print:hover { filter:brightness(.92) }
.card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; display:grid; gap:12px }
.card { border-top:3px solid var(--fg) }
label { font-size:12px; color:var(--gray); text-transform:uppercase; letter-spacing:.05em; color:var(--muted); font-weight:600 }
#sku { width:100%; font-size:26px; padding:12px 14px; border:2px solid var(--line); border-radius:8px; font-family:ui-monospace,Consolas,monospace; text-transform:uppercase }
#sku:focus { outline:none; border-color:var(--accent) }
.sugg { display:flex; flex-wrap:wrap; gap:6px }
.sugg button { border:1px solid var(--line); background:var(--bg); border-radius:6px; padding:4px 8px; cursor:pointer; font:13px ui-monospace,Consolas,monospace }
.sugg button:hover { border-color:var(--accent) }
.msg { font-weight:600 } .msg.err { color:var(--err) } .msg.ok { color:var(--ok) }
.info { display:grid; grid-template-columns:auto 1fr; gap:4px 12px; font-size:14px }
.info b { color:var(--muted); font-weight:600 }
.row { display:flex; flex-wrap:wrap; gap:12px; align-items:end }
.row > div { display:grid; gap:4px }
select, input[type=number] { font-size:15px; padding:8px; border:1px solid var(--line); border-radius:6px; background:var(--card); color:var(--fg) }
input[type=number] { width:90px }
#print { font-size:18px; font-weight:700; padding:12px 28px; border:0; border-radius:8px; background:var(--accent); color:#fff; cursor:pointer }
#print:disabled { opacity:.4; cursor:default }
.preview { display:flex; justify-content:center; padding:16px; background:repeating-linear-gradient(45deg,#ececea 0 8px,#f4f4f3 8px 16px); border-radius:8px }
.preview .label { box-shadow:0 1px 4px rgba(0,0,0,.25) }
.foot { font-size:12px; color:var(--muted) }
.foot button { font-size:12px }

/* Etiqueta */
.label { background:#fff; color:#000; overflow:hidden; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:1.5mm 2mm; page-break-after:always; break-after:page }
.label svg { width:100%; display:block }
.label .num { font:600 9pt/1 ui-monospace,Consolas,monospace; letter-spacing:.08em; margin-top:.6mm }
.label .sk { font:700 7pt/1.1 system-ui,sans-serif; margin-top:.6mm; text-align:center; max-width:100% ; white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
.label .nm { font:6pt/1.1 system-ui,sans-serif; text-align:center; max-height:2.3em; overflow:hidden }

#printarea { display:none }
@media print {
  body { background:#fff }
  .wrap, .top { display:none }
  #printarea { display:block }
  #printarea .label:last-child { page-break-after:auto; break-after:auto }
}
</style>
</head>

  const barH = h - 3 - 3.5 - textLines*3.2;  // mm disponibles para barras
  svg.style.height = Math.max(barH, 6)+'mm';
  const n = document.createElement('div'); n.className='num'; n.textContent=c.value; d.appendChild(n);
  if (txt!=='none' && c.value!==r[0]) { const s=document.createElement('div'); s.className='sk'; s.textContent=r[0]; d.appendChild(s); }
  if (txt==='skuname' && r[1]) { const s=document.createElement('div'); s.className='nm'; s.textContent=r[1]; d.appendChild(s); }
  return d;
}

function render(){
  if(!cur) return;
  $('preview').innerHTML=''; $('preview').appendChild(labelEl(cur));
  const [w,h]=SIZES[$('size').value];
  $('pagesize').textContent = `@page { size: ${w}mm ${h}mm; margin: 0 }`;
}

function select(r){
  cur = r;
  $('rSku').textContent=r[0]; $('rName').textContent=r[1]||'—';
  $('rEan').textContent = r[2] || 'Sin EAN en la base — se imprimirá el SKU';
  $('tipo').value = r[2] ? 'ean' : 'sku';
  $('tipo').querySelector('[value=ean]').disabled = !r[2];
  $('result').hidden=false; $('sugg').innerHTML='';
  $('msg').className='msg ok'; $('msg').textContent='Encontrado';
  $('copies').value=1;
  render();
  $('print').focus();
}

function search(){
  const q = $('sku').value.trim().toUpperCase();
  $('sugg').innerHTML='';
  if(!q){ $('msg').textContent=''; return; }
  const exact = IDX.get(q);
  if (exact) return select(exact);
  // búsqueda por EAN escaneado
  const byEan = DATA.find(r=>r[2] && (r[2]===cleanEan(q)));
  if (byEan) return select(byEan);
  cur=null; $('result').hidden=true;
  const parts = DATA.filter(r=>r[0].toUpperCase().includes(q) || (r[1]||'').toUpperCase().includes(q)).slice(0,20);
  $('msg').className='msg err';
  $('msg').textContent = parts.length ? 'No hay coincidencia exacta. ¿Es alguno de estos?' : 'SKU no encontrado en la base maestra';
  parts.forEach(r=>{ const b=document.createElement('button'); b.textContent=r[0]; b.title=r[1]||''; b.onclick=()=>{ $('sku').value=r[0]; select(r); }; $('sugg').appendChild(b); });
}

$('sku').addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); search(); } });
['tipo','size','showName'].forEach(id=>$(id).addEventListener('change',()=>{ try{localStorage.setItem('etq_size',$('size').value);localStorage.setItem('etq_txt',$('showName').value);}catch(e){} render(); }));

$('print').addEventListener('click', ()=>{
  if(!cur) return;
  const n = Math.min(Math.max(parseInt($('copies').value)||1,1),500);
  const pa = $('printarea'); pa.innerHTML='';
  for(let i=0;i<n;i++) pa.appendChild(labelEl(cur));
  render();
  window.print();
});
window.addEventListener('afterprint', ()=>{ $('printarea').innerHTML=''; $('sku').value=''; $('sku').focus(); });

// Recargar base desde Excel de Check
$('file').addEventListener('change', async e=>{
  const f=e.target.files[0]; if(!f) return;
  $('fileMsg').textContent='Leyendo…';
  try{
    if(!window.XLSX){ await new Promise((ok,ko)=>{ const s=document.createElement('script'); s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'; s.onload=ok; s.onerror=()=>ko(new Error('Sin internet para leer Excel')); document.head.appendChild(s); }); }
    const wb = XLSX.read(await f.arrayBuffer(), {type:'array'});
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {defval:'', raw:true});
    const k = Object.keys(rows[0]||{});
    const kc = k.find(x=>/^c[oó]digo$/i.test(x.trim())), kn = k.find(x=>/^nombre$/i.test(x.trim())), ke = k.find(x=>/^ean$/i.test(x.trim()));
    if(!kc) throw new Error('No encontré la columna "Código"');
    const nd = rows.filter(r=>String(r[kc]).trim()).map(r=>[String(r[kc]).trim(), String(kn?r[kn]:'').trim(), cleanEan(ke?r[ke]:'')]);
    DATA = nd; buildIdx();
    $('fecha').textContent = 'desde '+f.name;
    $('fileMsg').textContent = `Listo: ${nd.length} productos cargados (solo en esta sesión del navegador)`;
  }catch(err){ $('fileMsg').textContent = 'Error: '+err.message; }
});
</script>
